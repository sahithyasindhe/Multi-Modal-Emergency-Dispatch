version: "3.9"

# DEMO ONLY — does not connect to real emergency services.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_MODE=demo
      - DATABASE_URL=sqlite:////app/data/sentinel.db
      - CHROMA_PATH=/app/data/chroma
      - PROTOCOLS_PATH=/app/data/protocols
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - SENTINEL_API_URL=http://api:8000
      - MODEL_MODE=demo
    depends_on:
      - api
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
